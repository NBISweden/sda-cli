name: integration tests
on: [push]

jobs:
  integrationtests:
    name: integration-s3
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Build go code
        run: go build

      - name: Setup environment
        run: bash -x .github/integration/setup/setup.sh

      - name: Restart proxy services with populated config
        run: |
          docker compose -f testing/docker-compose.yml restart ceph_proxy proxy || docker restart ceph_proxy proxy

      - name: Wait for S3 service to be ready
        run: |
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if docker logs buckets 2>&1 | grep -q "Access permission for"; then
              echo "S3 service and buckets are fully ready"
              break
            fi
            attempt=$((attempt + 1))
            echo "Waiting for S3/buckets setup... (attempt $attempt/$max_attempts)"
            sleep 3
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "S3 service failed to respond correctly"
            docker logs s3
            docker logs buckets || true
            exit 1
          fi

      - name: Run tests
        run: |
            ls -1 .github/integration/tests/*.sh 2>/dev/null | sort -t/ -k5 -n | while read -r runscript; do
              echo "Executing setup script $runscript";
              bash -x "$runscript";
            done